[versions]
kotlin = "2.3.10"
android-gradle-plugin = "8.13.2"
compose-bom = "2026.02.00"
material3 = "1.4.0"
material-icons = "1.7.8"
androidx-activity = "1.12.4"
androidx-lifecycle = "2.6.2"
androidx-savedstate = "1.4.0"
androidx-navigation = "2.9.7"
androidx-biometric = "1.4.0-alpha02"
androidx-appcompat = "1.7.1"
androidx-fragment = "1.8.9"
androidx-constraintlayout = "2.2.1"
androidx-ui-graphics = "1.11.2"
firebase-messaging = "25.0.1"
google-services = "4.4.4"

# Testing
junit = "4.13.2"
mockito = "5.21.0"
mockito-kotlin = "6.2.3"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
androidx-test-espresso = "3.7.0"
androidx-test-compose = "1.10.3"
robolectric = "4.16.1"

# MTP-SDK
mtp-sdk = "4.3.13-debug"

# Build & Code Quality
detekt = "1.23.8"
kover = "0.9.7"

[libraries]
# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version = "2.2.20" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "material-icons" }

# Material Design
material3 = { group = "com.google.android.material", name = "material", version.ref = "material3" }

# AndroidX - Lifecycle & State Management
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-savedstate = { group = "androidx.lifecycle", name = "lifecycle-savedstate", version.ref = "androidx-lifecycle" }
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate", version.ref = "androidx-savedstate" }

# AndroidX - Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation" }
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "androidx-navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "androidx-navigation" }

# AndroidX - UI
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidx-fragment" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "androidx-ui-graphics" }

# AndroidX - Biometric
androidx-biometric = { group = "androidx.biometric", name = "biometric-ktx", version.ref = "androidx-biometric" }

# MTP-SDK
mtp-sdk = { group = "com.meawallet", name = "mtp-mea-simulator-test", version.ref = "mtp-sdk" }

# Testing - JUnit & Mockito
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
mockito-inline = { group = "org.mockito", name = "mockito-inline", version = "5.2.0" }

# Testing - AndroidX
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso" }
androidx-test-espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "androidx-test-espresso" }

# Testing - Compose
androidx-test-compose = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "androidx-test-compose" }
androidx-test-compose-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "androidx-test-compose" }

# Testing - Robolectric
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Firebase
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebase-messaging" }

[bundles]
compose = ["compose-ui", "compose-ui-graphics", "compose-foundation", "compose-material3", "compose-runtime", "androidx-activity-compose"]
compose-tooling = ["compose-ui-tooling", "compose-ui-tooling-preview"]
lifecycle = ["androidx-lifecycle-runtime", "androidx-lifecycle-runtime-compose", "androidx-lifecycle-viewmodel", "androidx-lifecycle-viewmodel-compose", "androidx-lifecycle-savedstate"]
navigation = ["androidx-navigation-compose", "androidx-navigation-fragment", "androidx-navigation-ui"]
testing-unit = ["junit", "mockito-core", "mockito-kotlin", "mockito-inline"]
testing-android = ["androidx-test-core", "androidx-test-runner"]
testing-espresso = ["androidx-test-espresso-core", "androidx-test-espresso-intents"]
testing-compose = ["androidx-test-compose"]

[plugins]
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-app = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
